<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Self-contained badge: amber background carries its own contrast so the
       icon reads on both light and dark tab chrome without relying on
       prefers-color-scheme (which misfires when the OS is dark-mode but the
       tab chrome is light, leaving the old silhouette invisible). -->
  <rect width="64" height="64" rx="12" ry="12" fill="#d97706"/>

  <!-- Open book seen face-on, two pages meeting at the spine. -->
  <path fill="#fafaf9"
        d="M8 20
           C 16 16, 26 16, 32 23
           V 54
           C 26 48, 16 48, 8 52
           Z"/>
  <path fill="#fafaf9"
        d="M56 20
           C 48 16, 38 16, 32 23
           V 54
           C 38 48, 48 48, 56 52
           Z"/>

  <!-- Four-point "scouring sparkle" — Tergeo is the scouring charm. -->
  <path fill="#fef3c7"
        d="M48 6
           L 50.5 11.5
           L 56 14
           L 50.5 16.5
           L 48 22
           L 45.5 16.5
           L 40 14
           L 45.5 11.5
           Z"/>
</svg>
